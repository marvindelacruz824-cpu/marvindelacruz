<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Marvin Dela Cruz — personal links">
  <title>Marvin Dela Cruz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      background: #faf9f6;
      color: #111;
      font-family: "Montserrat", Arial, sans-serif;
      overflow-x: hidden;
    }
    .page {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      padding: clamp(76px, 12vw, 112px) 0 56px;
    }
    .container {
      position: relative;
      z-index: 2;
      width: min(calc(100% - 56px), 530px);
      margin: 0 auto;
    }
    .profile {
      text-align: center;
    }
    .photo-wrap {
      width: clamp(142px, 35vw, 180px);
      aspect-ratio: 1;
      margin: 0 auto;
      padding: 5px;
      border: 2px solid #111;
      border-radius: 50%;
      background: #faf9f6;
    }
    .profile-photo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 32%;
      border-radius: 50%;
      border: 1px solid #cfcfcf;
    }
    h1 {
      margin: clamp(38px, 7vw, 48px) 0 0;
      font-family: "Libre Baskerville", Georgia, "Times New Roman", serif;
      font-size: clamp(31px, 8.2vw, 45px);
      line-height: 1.18;
      font-weight: 400;
      letter-spacing: -1.2px;
      white-space: nowrap;
    }
    .subtitle {
      margin: 18px 0 0;
      font-size: clamp(11px, 3.2vw, 14px);
      letter-spacing: clamp(2.5px, .8vw, 4px);
      line-height: 1.7;
    }
    .short-rule {
      width: 64px;
      height: 1px;
      margin: 31px auto clamp(46px, 9vw, 58px);
      background: #555;
    }
    .links {
      display: grid;
      gap: 14px;
    }
    .card {
      width: 100%;
      min-height: 91px;
      padding: 14px 20px;
      display: grid;
      grid-template-columns: 58px 1fr 22px;
      align-items: center;
      gap: 12px;
      color: #111;
      text-decoration: none;
      background: rgba(255,255,255,.58);
      border: 1px solid #dddcd8;
      border-radius: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.025);
      transition: transform .18s ease, border-color .18s ease;
    }
    .card:hover { transform: translateY(-1px); border-color: #c6c5c1; }
    .card:focus-visible { outline: 2px solid #111; outline-offset: 3px; }
    .icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
    }
    .icon svg { width: 42px; height: 42px; display: block; }
    .copy { text-align: left; min-width: 0; }
    .copy strong {
      display: block;
      font-size: clamp(16px, 4.2vw, 18px);
      line-height: 1.15;
      font-weight: 500;
    }
    .copy small {
      display: block;
      margin-top: 7px;
      color: #6b6b6b;
      font-size: clamp(11px, 3vw, 13px);
      line-height: 1.2;
    }
    .arrow {
      justify-self: end;
      font-family: Arial, sans-serif;
      font-size: 29px;
      font-weight: 300;
      line-height: 1;
    }
    footer {
      margin-top: 54px;
      text-align: center;
      color: #5f5f5f;
      font-size: 11px;
      line-height: 1.7;
      letter-spacing: 1px;
    }
    .footer-rule { width: 40px; height: 1px; background: #777; margin: 0 auto 25px; }
    footer p { margin: 0; }
    .corner {
      position: absolute;
      z-index: 0;
      pointer-events: none;
      fill: none;
      stroke: #111;
      stroke-width: 1.25;
    }
    .corner.top { top: 0; left: 0; width: clamp(110px, 25vw, 170px); }
    .corner.bottom { right: 0; bottom: 0; width: clamp(120px, 29vw, 190px); }

    @media (max-width: 370px) {
      .container { width: min(calc(100% - 34px), 530px); }
      .card { min-height: 84px; padding: 12px 15px; grid-template-columns: 50px 1fr 18px; gap: 9px; }
      .icon, .icon svg { width: 39px; height: 39px; }
      h1 { white-space: normal; }
    }
    @media (min-width: 700px) {
      .page { padding-top: 90px; }
      .container { width: min(calc(100% - 64px), 530px); }
      .card { min-height: 96px; }
    }
  </style>
</head>
<body>

    <footer>

      <p>© 2026 Marvin Dela Cruz.<br>All Rights Reserved.</p>

  </main>

  <svg class="corner bottom" viewBox="0 0 190 170" aria-hidden="true">
    <path d="M198 3 C165 24, 166 64, 137 82 C110 99, 72 101, 44 131 C36 140, 28 153, 23 176"/>
  </svg>
</div>
