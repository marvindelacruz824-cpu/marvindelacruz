<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Marvin Dela Cruz</title>
<meta name="description" content="Marvin Dela Cruz — personal links">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f6;--black:#111;--gray:#686868;--border:#deddd9}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;background:var(--bg)}
body{color:var(--black);font-family:Montserrat,Arial,sans-serif}
.page{position:relative;width:100%;min-height:100svh;overflow:hidden;background:var(--bg)}
.corner{position:absolute;z-index:0;pointer-events:none;fill:none;stroke:#111;stroke-width:1.15;vector-effect:non-scaling-stroke}
.corner.top{top:0;left:0;width:clamp(105px,28vw,185px)}
.corner.bottom{right:0;bottom:0;width:clamp(120px,31vw,200px)}
.container{position:relative;z-index:1;width:min(calc(100% - 36px),530px);min-height:100svh;margin:0 auto;padding:clamp(72px,12vh,110px) 0 clamp(32px,6vh,54px);display:flex;flex-direction:column}
.profile{text-align:center}
.photo-wrap{width:clamp(128px,36vw,176px);height:clamp(128px,36vw,176px);margin:0 auto clamp(27px,5vw,34px);border:1.5px solid #111;border-radius:50%;padding:5px;background:var(--bg)}
.photo-inner{width:100%;height:100%;border:1px solid #c9c9c6;border-radius:50%;overflow:hidden;background:#efefec;display:grid;place-items:center}
.photo-inner img{width:100%;height:100%;display:block;object-fit:cover}
.photo-inner img[src=""]{display:none}
.photo-placeholder{font-size:10px;letter-spacing:.18em;color:#888}
.photo-inner:has(img:not([src=""])) .photo-placeholder{display:none}
h1{margin:0;font-family:"Libre Baskerville",Georgia,serif;font-weight:400;font-size:clamp(29px,7.7vw,42px);line-height:1.16;letter-spacing:-.025em}
.subtitle{margin:clamp(17px,4vw,22px) 0 0;font-size:clamp(10px,2.6vw,13px);line-height:1.5;letter-spacing:.19em;font-weight:400}
.short-rule{width:64px;height:1px;background:#555;margin:clamp(28px,6vw,35px) auto clamp(37px,7vw,42px)}
.links{display:grid;gap:clamp(14px,3.5vw,17px)}
.card{width:100%;min-height:91px;padding:14px clamp(18px,5vw,27px);display:grid;grid-template-columns:58px minmax(0,1fr) 24px;align-items:center;color:#111;text-decoration:none;background:rgba(255,255,255,.42);border:1px solid var(--border);border-radius:15px;box-shadow:0 2px 7px rgba(0,0,0,.025);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.card:hover{transform:translateY(-1px);border-color:#c9c8c4;box-shadow:0 5px 12px rgba(0,0,0,.045)}
.card:focus-visible{outline:2px solid #111;outline-offset:3px}
.icon{width:43px;height:43px;display:grid;place-items:center;color:#050505}
.icon svg{width:42px;height:42px;display:block}
.copy{text-align:left;min-width:0;padding-left:2px}
.copy strong{display:block;font-size:clamp(15px,4vw,18px);line-height:1.2;font-weight:500;letter-spacing:.005em}
.copy small{display:block;margin-top:7px;color:var(--gray);font-size:clamp(10px,2.7vw,12px);line-height:1.25;letter-spacing:.015em}
.arrow{justify-self:end;font-family:Arial,sans-serif;font-size:29px;font-weight:200;line-height:1}
footer{margin-top:clamp(47px,9vh,70px);text-align:center;padding-bottom:2px}
.footer-rule{width:40px;height:1px;background:#777;margin:0 auto 29px}
footer p{margin:0;color:#5f5f5f;font-size:clamp(10px,2.6vw,12px);line-height:1.9;letter-spacing:.06em}
@media(max-width:360px){.container{width:min(calc(100% - 28px),530px);padding-top:64px}.photo-wrap{margin-bottom:23px}.short-rule{margin-bottom:31px}.card{min-height:78px;border-radius:13px;grid-template-columns:49px minmax(0,1fr) 20px;padding:11px 15px}.icon,.icon svg{width:36px;height:36px}.copy small{margin-top:5px}.links{gap:12px}footer{margin-top:39px}}
@media(min-width:700px){.container{width:min(calc(100% - 64px),530px)}.card{min-height:92px}.links{gap:16px}}
</style>
</head>
<body>

        <span class="copy"><strong>Gmail</strong><small>Send me an email</small></span><span class="arrow" aria-hidden="true">›</span>

    </nav>

    <footer><div class="footer-rule"></div><p>© 2026 Marvin Dela Cruz.<br>All Rights Reserved.</p></footer>

</div>

</body>
</html>
